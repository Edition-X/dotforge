---
# Common variables for all macbooks

# User and directory variables
user_name: "{{ lookup('env', 'USER') }}"
user_dir: "{{ lookup('env', 'HOME') }}"
user_group: "staff"

# Project paths
project_dir: "{{ user_dir }}/Projects/macbook-pro"
host_files_dir: "{{ project_dir }}/host_files/{{ inventory_hostname }}"

# SSH configuration
ssh_dir: "{{ user_dir }}/.ssh"
ssh_keys:
  - id_rsa
  - id_ed25519

# Python configuration
pip_executable: "{{ user_dir }}/.pyenv/shims/pip"

# Homebrew install prefix. /opt/homebrew on Apple Silicon, /usr/local on Intel.
# Shared across roles (packages, dotfiles), so it lives here rather than in a
# single role's defaults.
homebrew_prefix: /opt/homebrew

# Configuration file paths
config_paths:
  local_bin: "{{ user_dir }}/.local/bin"
  claude_work_config: "{{ user_dir }}/.claude-work"
  claude_work_executable: "{{ user_dir }}/.local/bin/claude-work"
  t3_user_data_dir: "{{ user_dir }}/.t3/userdata"
  t3_settings: "{{ user_dir }}/.t3/userdata/settings.json"
  ssh_config: "{{ ssh_dir }}/config"
  aliases: "{{ user_dir }}/.aliases"
  functions: "{{ user_dir }}/.functions"
  zshrc: "{{ user_dir }}/.zshrc"
  env_vars: "{{ user_dir }}/.env_vars"
  env_secrets: "{{ user_dir }}/.env_secrets"
  forge_dir: "{{ user_dir }}/forge"
  forge_mcp: "{{ user_dir }}/forge/.mcp.json"
  nvim: "{{ user_dir }}/.config/nvim"
  tmux_conf: "{{ user_dir }}/.tmux.conf"
  tmux_conf_local: "{{ user_dir }}/.tmux.conf.local"
  pyright_config: "{{ user_dir }}/pyrightconfig.json"
  ghostty_config: "{{ user_dir }}/.config/ghostty/config"
  gitconfig: "{{ user_dir }}/.gitconfig"
  git_ignore: "{{ user_dir }}/.config/git/ignore"
  skhdrc: "{{ user_dir }}/.skhdrc"
  opencode_dir: "{{ user_dir }}/.config/opencode"
  opencode_config: "{{ user_dir }}/.config/opencode/opencode.jsonc"
  opencode_agents: "{{ user_dir }}/.config/opencode/agents"
  opencode_commands: "{{ user_dir }}/.config/opencode/commands"
  opencode_routing: "{{ user_dir }}/.config/opencode/ROUTING.md"

# AI agent configuration. Shared between the ai_agents role (which deploys it)
# and cleanup (which removes it), so it lives here rather than in either role's
# defaults.
#
# One canonical AGENTS.md is linked into every harness below. The filename each
# harness expects differs; the content does not.
ai_source_dir: "{{ host_files_dir }}/ai"
ai_backup_dir: "{{ user_dir }}/.ai-config-backup"

# Arcane MCP server binary. Every harness must use this exact path.
ai_arcane_bin: "{{ config_paths.local_bin }}/arcane"

# Codex's config.toml is app-owned (ChatGPT desktop): roles/ai_agents/tasks/codex_mcp.yml
# only ever touches these mcp_servers.* entries via scripts/codex-mcp-sync.py,
# leaving every other section (other servers, [projects.*] trust levels,
# plugins, marketplaces, desktop settings) untouched. The token is a Jinja
# reference to the vault, resolved at runtime; it is never a literal here.
ai_codex_mcp_servers:
  arcane:
    command: "{{ ai_arcane_bin }}"
    args: ["mcp"]
  mcp-sunrise:
    url: "{{ mcp_gateway_url }}"
    http_headers:
      Authorization: "Bearer {{ mcp_gateway_sunrise_token }}"
ai_codex_mcp_remove: [linear, notion, grafana, figma]

# Claude Code profiles that receive managed MCP registrations and hooks.
# config_dir holds settings.json, CLAUDE.md and skills. MCP state lives in
# .claude.json: $HOME/.claude.json for the personal profile, and
# <CLAUDE_CONFIG_DIR>/.claude.json for the work profile. claude_argv pins
# both to user_dir so the idempotency test's fixture home never leaks into
# the real one, and is a list so paths with spaces survive.
ai_claude_profiles:
  - name: personal
    config_dir: "{{ user_dir }}/.claude"
    agents_dir: "{{ user_dir }}/.claude/agents"
    claude_argv:
      - env
      - -u
      - CLAUDE_CONFIG_DIR
      - "HOME={{ user_dir }}"
      - claude
  - name: work
    config_dir: "{{ config_paths.claude_work_config }}"
    agents_dir: "{{ config_paths.claude_work_config }}/agents"
    claude_argv:
      - env
      - "CLAUDE_CONFIG_DIR={{ config_paths.claude_work_config }}"
      - claude

# Managed Claude Code hooks. This list REPLACES the SessionStart list in each
# profile's settings.json; all other settings keys are preserved.
ai_claude_hooks:
  SessionStart:
    - matcher: "startup|resume|clear|compact"
      hooks:
        - type: command
          command: "{{ ai_arcane_bin }} context --project 2>/dev/null || true"
          timeout: 15

# Tool permissions every Claude profile must pre-approve.
ai_claude_permission_allow:
  - mcp__arcane
  - mcp__mcp-sunrise

ai_harnesses:
  - name: Claude Code
    dir: "{{ user_dir }}/.claude"
    instructions: "{{ user_dir }}/.claude/CLAUDE.md"
    skills: "{{ user_dir }}/.claude/skills"
  - name: Claude Code (work)
    dir: "{{ config_paths.claude_work_config }}"
    instructions: "{{ config_paths.claude_work_config }}/CLAUDE.md"
    skills: "{{ config_paths.claude_work_config }}/skills"
  - name: Codex
    dir: "{{ user_dir }}/.codex"
    instructions: "{{ user_dir }}/.codex/AGENTS.md"
    skills: "{{ user_dir }}/.codex/skills"
  - name: Forge
    dir: "{{ config_paths.forge_dir }}"
    instructions: "{{ config_paths.forge_dir }}/AGENTS.md"
    skills: "{{ config_paths.forge_dir }}/skills"
  - name: OpenCode
    dir: "{{ user_dir }}/.config/opencode"
    instructions: "{{ user_dir }}/.config/opencode/AGENTS.md"
    skills: "{{ user_dir }}/.config/opencode/skills"

# Skills owned by another repo. Linked to that repo rather than vendored here,
# so the owning repo stays the single source of truth and edits there take
# effect without a re-apply.
ai_external_skills_src: "{{ user_dir }}/Projects/paperclip/skills"
ai_external_skills:
  - paperclip
  - paperclip-create-agent
  - paperclip-create-plugin
  - para-memory-files

# OpenCode files are explicit so cleanup never removes user-owned agents,
# commands, credentials, history, caches, or package state.
#
# Each entry's `role` is the canonical routing role (host_files/localhost/ai/
# routing/workflow.yml); the renderer resolves that role's tier, prompt, and
# limits from workflow.yml and models.yml. No model ID appears here.
opencode_agents:
  - name: orchestrator
    file: orchestrator.md
    role: orchestrator
    mode: primary
    description: "Lead. Owns the ticket ledger, reviews diffs and checks, merges, never implements a ticket itself."
  - name: worker
    file: worker.md
    role: worker
    mode: subagent
    description: "Owns one whole ticket end to end: branch, edit, verify, commit, memory."
  - name: verifier
    file: verifier.md
    role: verifier
    mode: subagent
    description: "Read-only. Checks an already-integrated result; never implements or delegates."
  - name: rescue
    file: rescue.md
    role: rescue
    mode: subagent
    description: "Direct lead dispatch only, after a repeated similar failure trip-wire; never the default path."
  - name: documentation
    file: documentation.md
    role: documentation
    mode: subagent
    description: "Owns all Linear work and writes documentation and runbooks in documentation paths only."
  - name: scout
    file: scout.md
    role: scout
    mode: subagent
    description: "Optional read-only factual scout; returns findings, evidence, coverage, and unknowns only."

# Retired specialist agents from the pre-lead-worker nine-agent chain. Any
# exact regular file still present under the live agents directory is backed
# up once, then removed. Never sweep the directory itself; only these exact
# filenames are ever touched.
opencode_retired_agents:
  - architect.md
  - explorer.md
  - worker-fast.md
  - implementer.md
  - debugger.md
  - reviewer.md
  - test-runner.md

opencode_commands:
  - orchestrate.md
  - implement-reviewed.md
  - load-test-loop.md
  - review.md
  - debug-loop.md
  - wayfinder.md
  - linear.md
  - plan.md
  - grill.md
  - grilling.md
  - execute-playbook.md

# Native Claude Code subagents, rendered into both ai_claude_profiles'
# agents_dir. No custom `orchestrator` is rendered here: the T3 run this
# reproduces used Claude's normal root selected at the lead tier (Opus 5
# medium) with explicit Sonnet workers, not a custom primary agent (see
# workflow.yml roles.orchestrator and its claude_max_turns: null note).
#
# Each entry's `role` is the canonical routing role (host_files/localhost/ai/
# routing/workflow.yml); the renderer resolves that role's tier, prompt and
# claude_max_turns from workflow.yml and models.yml. No model ID appears here.
# Managed by exact filename only; the agents/ directory itself is never
# swept, so any other user-owned agent file is left untouched.
claude_agents:
  - name: worker
    file: worker.md
    role: worker
    description: "Owns one whole ticket end to end: branch, edit, verify, commit, memory."
  - name: verifier
    file: verifier.md
    role: verifier
    description: "Read-only. Checks an already-integrated result; never implements or delegates."
  - name: rescue
    file: rescue.md
    role: rescue
    description: "Direct lead dispatch only, after a repeated similar failure trip-wire; never the default path."
  - name: documentation
    file: documentation.md
    role: documentation
    description: "Owns all Linear work and writes documentation and runbooks in documentation paths only."
  - name: scout
    file: scout.md
    role: scout
    description: "Optional read-only factual scout; returns findings, evidence, coverage, and unknowns only."

# Native Codex custom agents, rendered into ~/.codex/agents/. T3 Codex inherits
# ~/.codex, so this list needs no separate T3 entry (see ai_harnesses).
#
# Each entry's `role` is the canonical routing role (host_files/localhost/ai/
# routing/workflow.yml); the renderer resolves that role's tier, prompt and
# sandbox mode from workflow.yml and models.yml. No model ID appears here.
# Managed by exact filename only; the agents/ directory itself is never
# swept, so any other user-owned agent file is left untouched. No custom
# `orchestrator` is rendered here, for the same reason as Claude (R4): normal
# Codex sessions use the root CLI at the lead tier via
# scripts/codex-agent-settings-sync.py's top-level model/effort, not a
# custom primary agent.
codex_agents:
  - name: worker
    file: worker.toml
    role: worker
    description: "Owns one whole ticket end to end: branch, edit, verify, commit, memory."
  - name: verifier
    file: verifier.toml
    role: verifier
    description: "Read-only. Checks an already-integrated result; never implements or delegates."
  - name: rescue
    file: rescue.toml
    role: rescue
    description: "Direct lead dispatch only, after a repeated similar failure trip-wire; never the default path."
  - name: documentation
    file: documentation.toml
    role: documentation
    description: "Owns all Linear work and writes documentation and runbooks in documentation paths only."
  - name: scout
    file: scout.toml
    role: scout
    description: "Optional read-only factual scout; returns findings, evidence, coverage, and unknowns only."

# Managed keys in Codex's app-owned config.toml (ChatGPT desktop): the CLI
# root model/effort, and default subagent selection/concurrency for the
# native agents above. scripts/codex-agent-settings-sync.py replaces only
# these exact top-level and agents.* keys; every other section (mcp_servers,
# [projects.*] trust levels, plugins, marketplaces, desktop settings) is
# untouched. Kept in sync with tiers.lead/tiers.worker in
# host_files/localhost/ai/routing/models.yml.
ai_codex_agent_defaults:
  model: "{{ ai_routing_models.tiers.lead.openai.model }}"
  model_reasoning_effort: "{{ ai_routing_models.tiers.lead.openai.effort }}"
  agents:
    enabled: true
    # Literal, not templated: workflow.yml's max_parallel_workers is an int and
    # Ansible templating always stringifies scalars, which would break the
    # sync script's TOML integer write. This is not a leaked provider ID (only
    # model strings are scanned for), so a literal here is safe and kept in
    # step with max_parallel_workers by comment, not by template.
    max_concurrent_threads_per_session: 3
    default_subagent_model: "{{ ai_routing_models.tiers.worker.openai.model }}"
    default_subagent_reasoning_effort: "{{ ai_routing_models.tiers.worker.openai.effort }}"

# Docker MCP Toolkit: one gateway serving Grafana, Notion and Linear to every
# harness over loopback. Secrets come from the vault and go into the macOS
# Keychain through Docker Desktop; they never touch harness configs.
mcp_toolkit_profile: sunrise
mcp_toolkit_servers: [grafana, notion-remote, linear]
mcp_toolkit_features_enabled: [tool-name-prefix]
mcp_toolkit_features_disabled: [dynamic-tools]
mcp_toolkit_grafana_read_tools:
  - search_dashboards
  - get_dashboard_by_uid
  - get_dashboard_summary
  - get_dashboard_panel_queries
  - get_dashboard_property
  - list_datasources
  - get_datasource
  - query_prometheus
  - query_prometheus_histogram
  - list_prometheus_metric_names
  - list_prometheus_metric_metadata
  - list_prometheus_label_names
  - list_prometheus_label_values
  - query_loki_logs
  - query_loki_stats
  - query_loki_patterns
  - list_loki_label_names
  - list_loki_label_values
  - list_alert_groups
  - get_alert_group
  - list_incidents
  - get_incident
  - search_folders
  - get_annotations
  - get_annotation_tags
  - generate_deeplink
  - get_panel_image
  - list_oncall_schedules
  - list_oncall_users
  - list_oncall_teams
  - get_current_oncall_users
  - get_oncall_shift
  - list_sift_investigations
  - get_sift_investigation
  - get_sift_analysis
  - find_error_pattern_logs
  - find_slow_requests
  - query_pyroscope
  - list_pyroscope_label_names
  - list_pyroscope_label_values
  - list_pyroscope_profile_types
  - get_assertions
mcp_gateway_host: 127.0.0.1
# One gateway process per profile. sunrise is work; a later personal profile
# gets its own port (8081), label, token and harness entry.
mcp_gateway_port: 8080
mcp_gateway_url: "http://{{ mcp_gateway_host }}:{{ mcp_gateway_port }}/mcp"
