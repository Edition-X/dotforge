[defaults]
collections_path = collections
# Verify host keys. This was disabled globally, which is invisible for a
# localhost inventory and removes MITM protection the moment any play targets a
# remote host from this directory.
host_key_checking = True
interpreter_python = auto_silent
inventory = inventory
nocows = True
roles_path = roles
# An executable, so Ansible runs it and reads the password from stdout: the
# password lives in 1Password (op://dotforge/ansible-vault/password), not in a
# file. The script falls back to ~/.config/dotforge/vault-pass when that file
# exists (CI writes a placeholder there; a machine mid-migration keeps its old
# file until it is trashed). Relative paths here resolve against this file's
# directory, not the current directory, so this is stable from any cwd.
vault_password_file = scripts/vault-pass
# ansible_managed is deprecated in ansible-core 2.15+ and will be removed in 2.23
# Use a custom variable in templates instead if needed.
retry_files_enabled = False

[diff]
always = True

[colors]
verbose = dark gray

[ssh_connection]
pipelining = True
# Not /tmp: control sockets there sit in a world-writable directory.
control_path = ~/.ansible/cp/%%h-%%p-%%r
