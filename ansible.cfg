[defaults]
collections_path = collections
# Verify host keys. This was disabled globally, which is invisible for a
# localhost inventory and removes MITM protection the moment any play targets a
# remote host from this directory.
host_key_checking = True
interpreter_python = auto_silent
inventory = inventory
nocows = True
roles_path = roles
# Absolute, and outside the working tree. A relative path made behaviour depend
# on the current directory, and a password file inside the repository is one
# `git add -f` away from being committed.
vault_password_file = ~/.config/macbook-pro/vault-pass
# ansible_managed is deprecated in ansible-core 2.15+ and will be removed in 2.23
# Use a custom variable in templates instead if needed.
retry_files_enabled = False

[diff]
always = True

[colors]
verbose = dark gray

[ssh_connection]
pipelining = True
# Not /tmp: control sockets there sit in a world-writable directory.
control_path = ~/.ansible/cp/%%h-%%p-%%r
