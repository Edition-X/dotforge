---
# Uninstall. Only ever removes paths this repo actually manages — see the note
# on the directory task below for why that distinction matters.
- name: Cleanup files and directories
  ansible.builtin.file:
    state: absent
    path: "{{ item }}"
  loop:
    # Public halves only: private keys live in 1Password, never in ~/.ssh.
    - "{{ ssh_dir }}/id_rsa.pub"
    - "{{ ssh_dir }}/id_ed25519.pub"
    - "{{ config_paths.ssh_config }}"
    - "{{ config_paths.ssh_agent_config }}"
    # Legacy: a symlink to a vault-encrypted file, so it could never have been
    # used as a password file. The real one lives at
    # ~/.config/dotforge/vault-pass and is deliberately not removed here —
    # losing it means losing access to every encrypted secret.
    - "{{ user_dir }}/.vault_pass.txt"
    - "{{ config_paths.aliases }}"
    - "{{ config_paths.functions }}"
    - "{{ config_paths.pyright_config }}"
    - "{{ config_paths.env_vars }}"
    - "{{ config_paths.env_secrets }}"
    - "{{ config_paths.zshrc }}"
    - "{{ config_paths.tmux_conf }}"
    - "{{ config_paths.tmux_conf_local }}"
    - "{{ config_paths.ghostty_config }}"
    - "{{ config_paths.gitconfig }}"
    - "{{ config_paths.git_ignore }}"
    - "{{ config_paths.nvim }}"
    # Forge: only the files this repo writes. The rest of ~/forge is Forge's own
    # state — database, snapshots, credentials, history — and is not ours to
    # delete.
    - "{{ config_paths.forge_mcp }}"
    - "{{ config_paths.skhdrc }}"
    - "{{ config_paths.opencode_config }}"
    - "{{ config_paths.opencode_routing }}"
  tags:
    - cleanup

- name: Cleanup - OpenCode agent files
  ansible.builtin.file:
    state: absent
    path: "{{ config_paths.opencode_agents }}/{{ item.file }}"
  loop: "{{ opencode_agents }}"
  loop_control:
    label: "{{ item.name }}"
  tags:
    - cleanup

- name: Cleanup - OpenCode command files
  ansible.builtin.file:
    state: absent
    path: "{{ config_paths.opencode_commands }}/{{ item }}"
  loop: "{{ opencode_commands }}"
  tags:
    - cleanup

# Same principle as ~/forge above: remove only the instruction symlink this repo
# owns. The rest of each harness directory is its own state — sessions, history,
# credentials, caches — and is not ours to delete.
- name: Cleanup - Agent instruction files
  ansible.builtin.file:
    state: absent
    path: "{{ item.instructions }}"
  loop: "{{ ai_harnesses }}"
  loop_control:
    label: "{{ item.name }}"
  tags:
    - cleanup

# Discovered here rather than reused from the ai_agents role, so that
# `--tags cleanup` works on its own without that role having run in the play.
- name: Cleanup - Discover repo-owned skills
  ansible.builtin.find:
    paths: "{{ ai_source_dir }}/skills"
    file_type: directory
    recurse: false
  register: cleanup_ai_skills
  tags:
    - cleanup

# Skill links only, not the directory: a harness may hold skills installed by
# other means alongside the ones linked from here.
- name: Cleanup - Agent skill links
  ansible.builtin.file:
    state: absent
    path: "{{ item.0.skills }}/{{ item.1 }}"
  loop: >-
    {{ ai_harnesses | product(
         cleanup_ai_skills.files | map(attribute='path') | map('basename') | list
       ) | list }}
  loop_control:
    label: "{{ item.0.name }}/{{ item.1 }}"
  tags:
    - cleanup

# Browser policy: only the exact files the browsers role declares it generates.
# Read from that role's defaults rather than restated here — the previous copy
# was hand-maintained and had already drifted from what the role installs.
# Profiles, bookmark catalogs, saved logins, quarantine and the isolated
# automation clone are never removed, so uninstalling policy never discards
# captured work. The sudoers rule and the helper itself are left for a
# deliberate privileged removal — but the managed-preference plists the helper
# installed are root-owned and this role's normal user cannot unlink them, so
# they are removed through that same helper below, not left in place.
- name: Cleanup - Load the browser role's declared paths
  ansible.builtin.include_vars:
    file: "{{ playbook_dir }}/roles/browsers/defaults/main.yml"
  tags:
    - cleanup

- name: Cleanup - Stop the browser capture service
  ansible.builtin.command:
    argv:
      - /bin/launchctl
      - bootout
      - "gui/{{ ansible_user_uid }}/{{ browsers_capture_label }}"
  register: cleanup_browser_capture_bootout
  changed_when: cleanup_browser_capture_bootout.rc == 0
  failed_when: false
  tags:
    - cleanup

- name: Cleanup - Generated browser policy and automation files
  ansible.builtin.file:
    state: absent
    path: "{{ item }}"
  loop: "{{ browsers_generated_paths }}"
  tags:
    - cleanup

# This tag can run without the browsers role's own escalation.yml ever having
# run in this play, so probe passwordless authorization directly rather than
# assuming a mode was already selected.
- name: Cleanup - Probe passwordless helper authorization
  ansible.builtin.command:
    argv:
      - /usr/bin/sudo
      - -n
      - "{{ browsers_privileged_helper }}"
      - --check
  register: cleanup_helper_probe
  changed_when: false
  failed_when: false
  check_mode: false
  tags:
    - cleanup

# Root-owned, so a plain `file: state=absent` as this role's user gets EACCES.
# Only the helper is allowed to touch /Library/Managed Preferences.
- name: Cleanup - Remove root-owned managed preferences through the helper
  ansible.builtin.command:
    argv:
      - /usr/bin/sudo
      - -n
      - "{{ browsers_privileged_helper }}"
      - --remove
      - "{{ item }}"
  loop: "{{ browsers_managed_preference_domains }}"
  when: cleanup_helper_probe.rc == 0
  changed_when: true
  tags:
    - cleanup

- name: Cleanup - Report skipped managed-preference removal
  ansible.builtin.debug:
    msg: >-
      Skipping removal of root-owned managed preferences: the privileged
      helper is not authorized on this machine. Remove
      {{ browsers_chromium_policy_dir }}/*.plist manually if needed.
  when: cleanup_helper_probe.rc != 0
  tags:
    - cleanup

# skhd's launchd agent is separate from its config file and does not get
# removed by deleting the symlink above.
- name: Cleanup - Stop and remove skhd service
  ansible.builtin.command:
    cmd: "{{ homebrew_prefix }}/bin/skhd --stop-service"
  register: cleanup_skhd_stop
  changed_when: cleanup_skhd_stop.rc == 0
  failed_when: false
  tags:
    - cleanup

# rmdir, not `state: absent`. This task used to remove ~/.ssh and ~/.config with
# `file: state=absent`, which deletes recursively regardless of the task name —
# so `make delete` would have taken out every unmanaged thing living in those
# directories too. rmdir refuses on a non-empty directory, which is the intent.
- name: Cleanup directories if empty
  ansible.builtin.command:
    cmd: "rmdir {{ item }}"
    removes: "{{ item }}"
  loop:
    - "{{ config_paths.ghostty_config | dirname }}"
    - "{{ config_paths.git_ignore | dirname }}"
    - "{{ ssh_dir }}"
    - "{{ user_dir }}/.config"
    - "{{ config_paths.opencode_agents }}"
    - "{{ config_paths.opencode_commands }}"
  register: cleanup_rmdir
  changed_when: cleanup_rmdir.rc == 0
  failed_when: false
  tags:
    - cleanup
