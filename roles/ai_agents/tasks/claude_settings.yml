---
# Merges managed hooks into each Claude profile's settings.json while
# preserving every other key Dan has set by hand. A profile's own `hooks`
# (ai_claude_profiles[].hooks) are added on top of the shared ai_claude_hooks.
# The managed set replaces the whole `hooks` object, so a hook removed from
# group_vars is removed from settings.json as well.

- name: Claude settings - Check settings file
  ansible.builtin.stat:
    path: "{{ item.config_dir }}/settings.json"
  loop: "{{ ai_claude_profiles }}"
  loop_control:
    label: "{{ item.name }}"
  register: ai_agents_claude_settings_stat
  tags: [ai, claude]

- name: Claude settings - Read existing settings
  ansible.builtin.slurp:
    src: "{{ item.stat.path }}"
  loop: "{{ ai_agents_claude_settings_stat.results }}"
  loop_control:
    label: "{{ item.item.name }}"
  when: item.stat.exists
  register: ai_agents_claude_settings_raw
  no_log: true
  tags: [ai, claude]

- name: Claude settings - Build merged document
  ansible.builtin.set_fact:
    ai_agents_claude_settings_desired: >-
      {{ ai_agents_claude_settings_desired | default({}) | combine({
           item.item.item.name: (
             _existing | combine({'hooks': _hooks})
                       | combine({'permissions': {'allow':
                           _existing_allow + (ai_claude_permission_allow | difference(_existing_allow))
                         }}, recursive=True)
                       | combine({
                           'model': ai_routing_models.tiers.lead.anthropic.model,
                           'effortLevel': ai_routing_models.tiers.lead.anthropic.effort
                         }, recursive=True)
                       | combine({'enabledPlugins': _existing_plugins | combine(_managed_plugins)}, recursive=True)
           )
         }) }}
  vars:
    _existing: "{{ (item.content | b64decode | from_json) if (item.content is defined) else {} }}"
    # Plugins this repo declares for the profile are enabled. The merge is
    # additive: anything Dan installed by hand in either profile
    # is left as it is, and retiring a declared plugin is
    # `claude-work plugin uninstall <name>` plus removing it here.
    _existing_plugins: "{{ _existing.enabledPlugins | default({}) }}"
    _managed_plugins: "{{ dict((item.item.item.plugins | default([])) | product([true])) }}"
    # Order-preserving union: keep the existing list's order untouched and
    # append only genuinely new entries. The `union` filter goes via a Python
    # set and its iteration order depends on per-process hash randomization,
    # so it reorders this list on every run and the settings task never
    # reaches "no changes" on a second apply.
    _existing_allow: "{{ (_existing.permissions | default({})).allow | default([]) }}"
    # Shared hooks plus this profile's own.
    _hooks: "{{ ai_claude_hooks | combine(item.item.item.hooks | default({})) }}"
  loop: "{{ ai_agents_claude_settings_raw.results }}"
  loop_control:
    label: "{{ item.item.item.name }}"
  no_log: true
  tags: [ai, claude]

- name: Claude settings - Install merged settings
  ansible.builtin.copy:
    content: "{{ ai_agents_claude_settings_desired[item.name] | to_nice_json }}"
    dest: "{{ item.config_dir }}/settings.json"
    mode: "0600"
  loop: "{{ ai_claude_profiles }}"
  loop_control:
    label: "{{ item.name }}"
  no_log: true
  tags: [ai, claude]
