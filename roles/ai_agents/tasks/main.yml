---
# One canonical AGENTS.md, symlinked into every harness. Linked rather than
# copied for the same reason as the rest of the dotfiles: a copy lets the live
# file drift silently and then get clobbered by the next apply, whereas a link
# makes any local tweak show up as a git diff in this repo.

# Runs first: fail before rendering anything if the canonical routing source
# (host_files/localhost/ai/routing/) is malformed.
- name: Routing - Load and validate canonical policy
  ansible.builtin.include_tasks: routing.yml

# Discovered rather than listed, so adding a skill is just adding a directory
# under host_files/localhost/ai/skills/ — no role edit needed.
- name: Discover repo-owned skills
  ansible.builtin.find:
    paths: "{{ ai_source_dir }}/skills"
    file_type: directory
    recurse: false
  register: ai_agents_skills_found

- name: Register repo-owned skill names
  ansible.builtin.set_fact:
    ai_agents_skills: >-
      {{ ai_agents_skills_found.files | map(attribute='path') | map('basename') | sort }}

# Created even under --check, so that the backup task below has somewhere to
# aim and a dry run reports what it would actually back up rather than erroring.
# An empty directory is a harmless thing to leave behind after a check run.
- name: Migration - Backup directory
  ansible.builtin.file:
    path: "{{ ai_backup_dir }}"
    state: directory
    owner: "{{ ansible_user_id }}"
    group: "{{ ansible_user_gid }}"
    mode: '0700'
  check_mode: false

- name: Migration - Stat pre-existing instruction files
  ansible.builtin.stat:
    path: "{{ item.instructions }}"
  loop: "{{ ai_harnesses }}"
  loop_control:
    label: "{{ item.name }}"
  register: ai_agents_existing_instructions

# Runs before the first link replaces anything, on any machine. Kept rather
# than treated as a completed migration: a harness on a new machine may still
# carry a hand-written instruction file, and this is what stops the first apply
# from silently replacing it. force:false means a second apply never overwrites
# the first backup, and the `when` below skips anything already linked, so on a
# converged machine it does nothing.
- name: Migration - Back up hand-maintained instruction files
  ansible.builtin.copy:
    src: "{{ item.stat.path }}"
    dest: "{{ ai_backup_dir }}/{{ item.item.name | lower | replace(' ', '-') }}-{{ item.stat.path | basename }}"
    remote_src: true
    force: false
    owner: "{{ ansible_user_id }}"
    group: "{{ ansible_user_gid }}"
    mode: '0600'
  loop: "{{ ai_agents_existing_instructions.results }}"
  loop_control:
    label: "{{ item.item.name }}"
  when:
    - item.stat.exists
    - not item.stat.islnk

- name: Harness - Config directory
  ansible.builtin.file:
    path: "{{ item.dir }}"
    state: directory
    owner: "{{ ansible_user_id }}"
    group: "{{ ansible_user_gid }}"
    mode: '0700'
  loop: "{{ ai_harnesses }}"
  loop_control:
    label: "{{ item.name }}"

- name: Harness - Canonical instruction file
  ansible.builtin.file:
    src: "{{ ai_source_dir }}/AGENTS.md"
    dest: "{{ item.instructions }}"
    state: link
    force: true
    owner: "{{ ansible_user_id }}"
    group: "{{ ansible_user_gid }}"
  loop: "{{ ai_harnesses }}"
  loop_control:
    label: "{{ item.name }}"

- name: Harness - Skills directory
  ansible.builtin.file:
    path: "{{ item.skills }}"
    state: directory
    owner: "{{ ansible_user_id }}"
    group: "{{ ansible_user_gid }}"
    mode: '0700'
  loop: "{{ ai_harnesses }}"
  loop_control:
    label: "{{ item.name }}"

# The skills directory itself stays a real directory rather than a link, because
# each harness mixes repo-owned skills with skills linked out to the repo that
# owns them. Only the individual skills are links.
- name: Migration - Stat skills about to be replaced by links
  ansible.builtin.stat:
    path: "{{ item.0.skills }}/{{ item.1 }}"
  loop: "{{ ai_harnesses | product(ai_agents_skills) | list }}"
  loop_control:
    label: "{{ item.0.name }}/{{ item.1 }}"
  register: ai_agents_existing_skills

# A non-empty directory cannot be replaced by a link in place, so the copies
# these skills were vendored as have to go first. Their content is already in
# this repo — that is where they were copied from.
#
# Under --check this removal is not performed, so the link task below then
# reports "refusing to convert it" against directories that a real run would
# have already cleared. Those check-mode failures are expected on a machine
# that has not been migrated yet, and disappear once it has.
- name: Migration - Remove copied skills superseded by links
  ansible.builtin.file:
    path: "{{ item.item.0.skills }}/{{ item.item.1 }}"
    state: absent
  loop: "{{ ai_agents_existing_skills.results }}"
  loop_control:
    label: "{{ item.item.0.name }}/{{ item.item.1 }}"
  when:
    - item.stat.exists
    - not item.stat.islnk

- name: Harness - Shared skills
  ansible.builtin.file:
    src: "{{ ai_source_dir }}/skills/{{ item.1 }}"
    dest: "{{ item.0.skills }}/{{ item.1 }}"
    state: link
    force: true
    owner: "{{ ansible_user_id }}"
    group: "{{ ansible_user_gid }}"
  loop: "{{ ai_harnesses | product(ai_agents_skills) | list }}"
  loop_control:
    label: "{{ item.0.name }}/{{ item.1 }}"

- name: AI agents - Find deployed skill links
  ansible.builtin.find:
    paths: "{{ item.skills }}"
    file_type: link
    depth: 1
  loop: "{{ ai_harnesses }}"
  loop_control:
    label: "{{ item.name }}"
  register: ai_agents_deployed_skill_links
  tags: [ai]

# Ansible's `is exists` test does not follow symlinks, so it cannot tell a
# dangling link from a live one. stat with follow=true can.
- name: AI agents - Stat unmanaged skill links
  ansible.builtin.stat:
    path: "{{ item.1.path }}"
    follow: true
  loop: "{{ ai_agents_deployed_skill_links.results | subelements('files', skip_missing=True) }}"
  loop_control:
    label: "{{ item.1.path }}"
  when:
    - item.1.path | basename not in ai_agents_skills
    - item.1.path | basename not in ai_external_skills
  register: ai_agents_unmanaged_skill_links
  tags: [ai]

- name: AI agents - Remove skill links whose target is gone
  ansible.builtin.file:
    path: "{{ item.item.1.path }}"
    state: absent
  loop: "{{ ai_agents_unmanaged_skill_links.results }}"
  loop_control:
    label: "{{ item.item.1.path if item.item is defined else 'skipped' }}"
  when:
    - item.skipped is not defined
    - not item.stat.exists
  tags: [ai]

# Linked to the repo that owns them, so edits in Projects/paperclip take effect
# for every harness without a re-apply.
- name: Harness - Externally owned skills
  ansible.builtin.file:
    src: "{{ ai_external_skills_src }}/{{ item.1 }}"
    dest: "{{ item.0.skills }}/{{ item.1 }}"
    state: link
    force: true
    owner: "{{ ansible_user_id }}"
    group: "{{ ansible_user_gid }}"
  loop: "{{ ai_harnesses | product(ai_external_skills) | list }}"
  loop_control:
    label: "{{ item.0.name }}/{{ item.1 }}"

- name: OpenCode - Backup directory
  ansible.builtin.file:
    path: "{{ ai_backup_dir }}/opencode"
    state: directory
    owner: "{{ ansible_user_id }}"
    group: "{{ ansible_user_gid }}"
    mode: '0700'
  check_mode: false

- name: OpenCode - Stat migration marker
  ansible.builtin.stat:
    path: "{{ ai_backup_dir }}/opencode/.managed"
  register: ai_agents_opencode_backup_marker

- name: OpenCode - Stat existing config files
  ansible.builtin.stat:
    path: "{{ item }}"
  loop:
    - "{{ config_paths.opencode_config }}"
    - "{{ config_paths.opencode_routing }}"
  register: ai_agents_opencode_existing_config_files

- name: OpenCode - Back up existing config files
  ansible.builtin.copy:
    src: "{{ item.stat.path }}"
    dest: "{{ ai_backup_dir }}/opencode/{{ item.stat.path | basename }}"
    remote_src: true
    force: false
    owner: "{{ ansible_user_id }}"
    group: "{{ ansible_user_gid }}"
    mode: '0600'
  loop: "{{ ai_agents_opencode_existing_config_files.results }}"
  loop_control:
    label: "{{ item.item }}"
  when:
    - item.stat.exists
    - item.stat.isreg
    - not ai_agents_opencode_backup_marker.stat.exists

- name: OpenCode - Stat existing managed agents
  ansible.builtin.stat:
    path: "{{ config_paths.opencode_agents }}/{{ item.file }}"
  loop: "{{ opencode_agents }}"
  loop_control:
    label: "{{ item.name }}"
  register: ai_agents_opencode_existing_agents

- name: OpenCode - Back up existing managed agents
  ansible.builtin.copy:
    src: "{{ item.stat.path }}"
    dest: "{{ ai_backup_dir }}/opencode/{{ item.item.file }}"
    remote_src: true
    force: false
    owner: "{{ ansible_user_id }}"
    group: "{{ ansible_user_gid }}"
    mode: '0600'
  loop: "{{ ai_agents_opencode_existing_agents.results }}"
  loop_control:
    label: "{{ item.item.name }}"
  when:
    - item.stat.exists
    - item.stat.isreg
    - not ai_agents_opencode_backup_marker.stat.exists

- name: OpenCode - Stat existing managed commands
  ansible.builtin.stat:
    path: "{{ config_paths.opencode_commands }}/{{ item }}"
  loop: "{{ opencode_commands }}"
  register: ai_agents_opencode_existing_commands

- name: OpenCode - Back up existing managed commands
  ansible.builtin.copy:
    src: "{{ item.stat.path }}"
    dest: "{{ ai_backup_dir }}/opencode/{{ item.item }}"
    remote_src: true
    force: false
    owner: "{{ ansible_user_id }}"
    group: "{{ ansible_user_gid }}"
    mode: '0600'
  loop: "{{ ai_agents_opencode_existing_commands.results }}"
  loop_control:
    label: "{{ item.item }}"
  when:
    - item.stat.exists
    - item.stat.isreg
    - not ai_agents_opencode_backup_marker.stat.exists

- name: OpenCode - Retired agents backup directory
  ansible.builtin.file:
    path: "{{ ai_backup_dir }}/opencode/retired"
    state: directory
    owner: "{{ ansible_user_id }}"
    group: "{{ ansible_user_gid }}"
    mode: '0700'
  check_mode: false

- name: OpenCode - Stat existing retired agents
  ansible.builtin.stat:
    path: "{{ config_paths.opencode_agents }}/{{ item }}"
  loop: "{{ opencode_retired_agents }}"
  register: ai_agents_opencode_existing_retired_agents

# Backed up once each: force:false skips a retired file whose backup already
# exists under .../opencode/retired/, so a second apply neither re-copies nor
# reports changed.
- name: OpenCode - Back up retired agents not already preserved
  ansible.builtin.copy:
    src: "{{ item.stat.path }}"
    dest: "{{ ai_backup_dir }}/opencode/retired/{{ item.item }}"
    remote_src: true
    force: false
    owner: "{{ ansible_user_id }}"
    group: "{{ ansible_user_gid }}"
    mode: '0600'
  loop: "{{ ai_agents_opencode_existing_retired_agents.results }}"
  loop_control:
    label: "{{ item.item }}"
  when:
    - item.stat.exists
    - item.stat.isreg

# Only these exact retired filenames are ever removed; the agents directory
# itself is never swept, so any user-owned agent file is untouched.
- name: OpenCode - Remove retired agent files
  ansible.builtin.file:
    path: "{{ config_paths.opencode_agents }}/{{ item }}"
    state: absent
  loop: "{{ opencode_retired_agents }}"
  loop_control:
    label: "{{ item }}"

- name: OpenCode - Stage and validate managed configuration
  block:
    - name: OpenCode - Create staging directory
      ansible.builtin.tempfile:
        state: directory
        prefix: opencode-
      register: ai_agents_opencode_stage
      check_mode: false
      changed_when: false

    - name: OpenCode - Create staged directories
      ansible.builtin.file:
        path: "{{ ai_agents_opencode_stage.path }}/{{ item }}"
        state: directory
        mode: '0700'
      loop:
        - agents
        - commands
      check_mode: false
      changed_when: false

    - name: OpenCode - Stage main config
      ansible.builtin.template:
        src: opencode.jsonc.j2
        dest: "{{ ai_agents_opencode_stage.path }}/opencode.jsonc"
        mode: '0600'
      check_mode: false
      changed_when: false
      no_log: true

    - name: OpenCode - Stage routing documentation
      ansible.builtin.template:
        src: opencode-routing.md.j2
        dest: "{{ ai_agents_opencode_stage.path }}/ROUTING.md"
        mode: '0644'
      check_mode: false
      changed_when: false

    - name: OpenCode - Stage agent definitions
      ansible.builtin.template:
        src: opencode/agent.md.j2
        dest: "{{ ai_agents_opencode_stage.path }}/agents/{{ item.file }}"
        mode: '0644'
      loop: "{{ opencode_agents }}"
      loop_control:
        label: "{{ item.name }}"
      check_mode: false
      changed_when: false

    - name: OpenCode - Stage command definitions
      ansible.builtin.copy:
        src: "{{ ai_source_dir }}/opencode/commands/{{ item }}"
        dest: "{{ ai_agents_opencode_stage.path }}/commands/{{ item }}"
        remote_src: true
        mode: '0644'
      loop: "{{ opencode_commands }}"
      check_mode: false
      changed_when: false

    - name: OpenCode - Validate staged configuration
      ansible.builtin.command:
        cmd: >-
          {{ project_dir | quote }}/scripts/validate-opencode-config.sh
           --config-dir {{ ai_agents_opencode_stage.path | quote }}
      register: ai_agents_opencode_validation
      changed_when: false
      check_mode: false

    - name: OpenCode - Config directory
      ansible.builtin.file:
        path: "{{ config_paths.opencode_dir }}"
        state: directory
        owner: "{{ ansible_user_id }}"
        group: "{{ ansible_user_gid }}"
        mode: '0700'
      check_mode: false

    - name: OpenCode - Agents directory
      ansible.builtin.file:
        path: "{{ config_paths.opencode_agents }}"
        state: directory
        owner: "{{ ansible_user_id }}"
        group: "{{ ansible_user_gid }}"
        mode: '0700'
      check_mode: false

    - name: OpenCode - Commands directory
      ansible.builtin.file:
        path: "{{ config_paths.opencode_commands }}"
        state: directory
        owner: "{{ ansible_user_id }}"
        group: "{{ ansible_user_gid }}"
        mode: '0700'
      check_mode: false

    - name: OpenCode - Install validated main config
      ansible.builtin.copy:
        src: "{{ ai_agents_opencode_stage.path }}/opencode.jsonc"
        dest: "{{ config_paths.opencode_config }}"
        remote_src: true
        owner: "{{ ansible_user_id }}"
        group: "{{ ansible_user_gid }}"
        mode: '0600'
      no_log: true

    - name: OpenCode - Install validated routing documentation
      ansible.builtin.copy:
        src: "{{ ai_agents_opencode_stage.path }}/ROUTING.md"
        dest: "{{ config_paths.opencode_routing }}"
        remote_src: true
        owner: "{{ ansible_user_id }}"
        group: "{{ ansible_user_gid }}"
        mode: '0644'

    - name: OpenCode - Install validated agents
      ansible.builtin.copy:
        src: "{{ ai_agents_opencode_stage.path }}/agents/{{ item.file }}"
        dest: "{{ config_paths.opencode_agents }}/{{ item.file }}"
        remote_src: true
        owner: "{{ ansible_user_id }}"
        group: "{{ ansible_user_gid }}"
        mode: '0644'
      loop: "{{ opencode_agents }}"
      loop_control:
        label: "{{ item.name }}"

    - name: OpenCode - Install validated commands
      ansible.builtin.copy:
        src: "{{ ai_agents_opencode_stage.path }}/commands/{{ item }}"
        dest: "{{ config_paths.opencode_commands }}/{{ item }}"
        remote_src: true
        owner: "{{ ansible_user_id }}"
        group: "{{ ansible_user_gid }}"
        mode: '0644'
      loop: "{{ opencode_commands }}"

    - name: OpenCode - Mark migration backup complete
      ansible.builtin.file:
        path: "{{ ai_backup_dir }}/opencode/.managed"
        state: touch
        owner: "{{ ansible_user_id }}"
        group: "{{ ansible_user_gid }}"
        mode: '0600'
      when: not ai_agents_opencode_backup_marker.stat.exists
  always:
    - name: OpenCode - Remove staging directory
      ansible.builtin.file:
        path: "{{ ai_agents_opencode_stage.path | default('') }}"
        state: absent
      when: ai_agents_opencode_stage is defined and ai_agents_opencode_stage.path is defined
      check_mode: false
      changed_when: false
- name: Retired harnesses - Remove orphaned instruction files
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop: "{{ ai_agents_unused_instructions }}"
  when: ai_agents_prune_unused | bool

- name: T3 Code - Configure isolated Claude profile
  ansible.builtin.include_tasks: t3.yml
  tags:
    - ai
    - claude

- name: Claude agents - Render lead-worker subagents
  ansible.builtin.include_tasks: claude_agents.yml
  tags:
    - ai
    - claude

- name: Claude MCP - Manage arcane registration
  ansible.builtin.include_tasks: claude_mcp.yml
  tags:
    - ai
    - claude


# Codex agents run before Codex MCP: codex-agent-settings-sync.py is the
# first task to ever add a top-level [agents] table after [mcp_servers] in a
# fresh config.toml, and codex-mcp-sync.py's build_table() always rebuilds
# mcp_servers' sub-tables from scratch, which does not preserve the blank
# line trivia separating mcp_servers from whatever table follows it. Running
# the [agents] table into place first means mcp_servers is always the last
# table any script rebuilds fresh, so that trivia loss never has a following
# section to disturb, and both scripts stay independently idempotent.
- name: Codex agents - Render lead-worker subagents and sync defaults
  ansible.builtin.include_tasks: codex_agents.yml
  tags:
    - ai
    - codex

- name: Codex MCP - Manage mcp_servers entries
  ansible.builtin.include_tasks: codex_mcp.yml
  tags:
    - ai
    - codex

- name: Claude settings - Manage hooks and permissions
  ansible.builtin.include_tasks: claude_settings.yml
  tags:
    - ai
    - claude
