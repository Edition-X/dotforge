---
- name: Chromium policy - Configure browser-owned adapters
  ansible.builtin.include_tasks: chromium-browser.yml
  loop: "{{ browsers_chromium_adapters }}"
  loop_control:
    loop_var: browsers_chromium_adapter
    label: "{{ browsers_chromium_adapter.name }}"
  vars:
    browsers_chromium_name: "{{ browsers_chromium_adapter.name }}"
    browsers_chromium_catalog: "{{ browsers_chromium_adapter.catalog }}"
    browsers_chromium_domain: "{{ browsers_chromium_adapter.domain }}"
    browsers_chromium_bookmark_policy: "{{ browsers_chromium_adapter.bookmark_policy }}"
    browsers_chromium_policy_stage: "{{ browsers_state_dir }}/{{ browsers_chromium_adapter.domain }}.plist"
    browsers_chromium_policy_path: "{{ browsers_chromium_policy_dir }}/{{ browsers_chromium_adapter.domain }}.plist"
