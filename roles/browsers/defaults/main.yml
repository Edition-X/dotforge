---
browsers_catalog_root: "{{ playbook_dir }}/host_files/localhost/browsers"
browsers_catalog_names:
  - chrome
  - edge
  - brave
  - firefox
  - vivaldi

browsers_state_dir: "{{ user_dir }}/.local/state/macbook-pro/browser-policy"
browsers_chromium_policy_dir: "/Library/Managed Preferences/{{ osx_username }}"
browsers_chromium_adapters:
  - name: Chrome
    catalog: chrome
    domain: com.google.Chrome
    bookmark_policy: ManagedBookmarks
  - name: Edge
    catalog: edge
    domain: com.microsoft.Edge
    bookmark_policy: ManagedFavorites
  - name: Brave
    catalog: brave
    domain: com.brave.Browser
    bookmark_policy: ManagedBookmarks
browsers_firefox_app: /Applications/Firefox.app
browsers_firefox_resources: "{{ browsers_firefox_app }}/Contents/Resources"
browsers_firefox_policy_dir: "{{ browsers_firefox_resources }}/distribution"
browsers_firefox_policy_path: "{{ browsers_firefox_policy_dir }}/policies.json"
browsers_firefox_policy_stage: "{{ browsers_state_dir }}/firefox-policies.json"
browsers_vivaldi_app: /Applications/Vivaldi.app
browsers_vivaldi_profile: "{{ user_dir }}/Library/Application Support/Vivaldi/Default"
browsers_vivaldi_audit_path: "{{ browsers_state_dir }}/vivaldi-audit.sh"
browsers_quarantine_path: "{{ browsers_state_dir }}/quarantine.json"
browsers_generated_paths:
  - "{{ browsers_state_dir }}/com.google.Chrome.plist"
  - "{{ browsers_chromium_policy_dir }}/com.google.Chrome.plist"
  - "{{ browsers_state_dir }}/com.microsoft.Edge.plist"
  - "{{ browsers_chromium_policy_dir }}/com.microsoft.Edge.plist"
  - "{{ browsers_state_dir }}/com.brave.Browser.plist"
  - "{{ browsers_chromium_policy_dir }}/com.brave.Browser.plist"
  - "{{ browsers_firefox_policy_stage }}"
  - "{{ browsers_firefox_policy_path }}"
  - "{{ browsers_vivaldi_audit_path }}"
