---
# tmux.conf is vendored oh-my-tmux and is never hand-edited, so a copy is right.
- name: TMUX - Base config file
  ansible.builtin.copy:
    src: "{{ host_files_dir }}/tmux.conf"
    dest: "{{ config_paths.tmux_conf }}"
    owner: "{{ ansible_user_id }}"
    group: "{{ ansible_user_gid }}"
    mode: '0644'
  tags:
    - dot

# tmux.conf.local is the file that actually gets tweaked, so link it and let
# local changes surface as a git diff instead of being silently overwritten.
- name: TMUX - Local overrides file
  ansible.builtin.file:
    src: "{{ host_files_dir }}/tmux.conf.local"
    dest: "{{ config_paths.tmux_conf_local }}"
    state: link
    follow: false
    force: true
    owner: "{{ ansible_user_id }}"
    group: "{{ ansible_user_gid }}"
  tags:
    - dot

- name: TMUX - Remove layout scripts
  ansible.builtin.file:
    path: "{{ user_dir }}/.tmux-layouts/{{ item }}"
    state: absent
  loop:
    - tmux-dev-layout.sh
    - tmux-monitor-layout.sh
    - tmux-deploy-layout.sh
  tags:
    - dot
