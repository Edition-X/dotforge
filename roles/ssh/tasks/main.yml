---
# Private keys are not deployed: they live in 1Password and the 1Password SSH
# agent serves them (config.j2 points IdentityAgent at its socket, and the
# dotfiles role writes the agent.toml that opens the dotforge vault to it).
# Only the public halves land here, so IdentityFile can name the key to use.
- name: SSH - Public keys
  ansible.builtin.copy:
    src: "{{ host_files_dir }}/{{ item }}.pub"
    dest: "{{ ssh_dir }}/{{ item }}.pub"
    owner: "{{ ansible_user_id }}"
    group: "{{ ansible_user_gid }}"
    mode: '0644'
  with_items: "{{ ssh_keys }}"

# config.j2 is vault-encrypted (it names an employer's fleet); the template
# module decrypts it. Edit with `ansible-vault edit roles/ssh/templates/config.j2`.
- name: SSH - Config file
  ansible.builtin.template:
    src: "config.j2"
    dest: "{{ config_paths.ssh_config }}"
    owner: "{{ ansible_user_id }}"
    group: "{{ ansible_user_gid }}"
    mode: '0644'
  tags:
    - dot
