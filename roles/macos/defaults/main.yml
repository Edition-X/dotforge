---
# macOS defaults.
#
# This list was captured from the live machine rather than invented, so a first
# apply is a no-op. Only settings that were already deliberately changed from
# the macOS default are listed — the point is to stop them being lost on a
# rebuild, not to impose new preferences.
macos_defaults:  # noqa: var-naming[no-role-prefix]
  # Show all file extensions in Finder
  - domain: NSGlobalDomain
    key: AppleShowAllExtensions
    type: bool
    value: true

  # Deliberately NOT managing NSGlobalDomain AppleInterfaceStyle. This machine
  # has AppleInterfaceStyleSwitchesAutomatically = 1, so macOS adds and removes
  # that key itself as it moves between light and dark. Declaring it captured
  # whatever happened to be set at capture time and then forced it back on every
  # apply, fighting the OS. If you ever pin appearance manually, add it back.

  # No autocorrect or auto-capitalisation while typing code
  - domain: NSGlobalDomain
    key: NSAutomaticCapitalizationEnabled
    type: bool
    value: false
  - domain: NSGlobalDomain
    key: NSAutomaticSpellingCorrectionEnabled
    type: bool
    value: false

  # F1-F12 act as standard function keys by default; hold Fn for volume,
  # brightness, etc. This is the opposite of the factory default, where the
  # media functions fire on a bare press and Fn gives you F1-F12. Needed so
  # skhd (see the dotfiles role) can bind bare F-keys to open apps without
  # every press also changing the volume.
  #
  # Written to BOTH the plain global domain and the currentHost (per-machine)
  # domain — the `defaults -currentHost` equivalent — because it was unclear
  # which one macOS actually reads for this key versus which one just silently
  # accepts the write and is ignored. Belt and braces rather than a guess.
  #
  # This key needs a LOGOUT (not just re-running `make apply`) to take effect.
  # Unlike Dock/Finder settings, nothing can be killall'd to make the keyboard
  # HID interpretation layer re-read it live.
  - domain: NSGlobalDomain
    key: com.apple.keyboard.fnState
    type: bool
    value: true
  - domain: NSGlobalDomain
    key: com.apple.keyboard.fnState
    type: bool
    value: true
    host: currentHost

  # Dock hidden and pinned to the left edge
  - domain: com.apple.dock
    key: autohide
    type: bool
    value: true
  - domain: com.apple.dock
    key: orientation
    type: string
    value: left

  # Finder: path and status bars visible, list view by default
  - domain: com.apple.finder
    key: ShowPathbar
    type: bool
    value: true
  - domain: com.apple.finder
    key: ShowStatusBar
    type: bool
    value: true
  - domain: com.apple.finder
    key: FXPreferredViewStyle
    type: string
    value: Nlsv
