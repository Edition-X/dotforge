---
- name: Create needed directories in home directory
  ansible.builtin.file:
    state: directory
    path: "{{ item }}"
    owner: "{{ ansible_user_id }}"
    group: "{{ ansible_user_gid }}"
    mode: '0700'
    modification_time: preserve
    access_time: preserve
  with_items:
    - "{{ ssh_dir }}"
    - "{{ user_dir }}/.config"
