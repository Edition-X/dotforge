---
# Antigen compiles the bundle and theme list from .zshrc into ~/.antigen/init.zsh
# and, on later shells, sources that cache instead of re-reading the `antigen`
# lines. So editing .zshrc has no effect until the cache is thrown away.
#
# This bit once: a prompt change had no effect because a cache from months
# earlier kept sourcing the old theme, whose precmd hook rebuilds PROMPT on
# every prompt. The cache is derived state, so deploying .zshrc invalidates it.
- name: Invalidate antigen cache
  ansible.builtin.file:
    path: "{{ user_dir }}/.antigen/{{ item }}"
    state: absent
  loop:
    - init.zsh
    - init.zsh.zwc

# skhd does not watch its config file, so a change needs an explicit restart to
# take effect. failed_when: false because the service is not installed yet on a
# first run — the "skhd - Install and start service" task starts it fresh in
# that case and this handler has nothing to do.
- name: Restart skhd service
  ansible.builtin.command:
    cmd: "{{ homebrew_prefix }}/bin/skhd --restart-service"
  register: dotfiles_skhd_restart
  changed_when: dotfiles_skhd_restart.rc == 0
  failed_when: false
