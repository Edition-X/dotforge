---
- name: .aliases - Config file
  ansible.builtin.file:
    src: "{{ host_files_dir }}/aliases"
    dest: "{{ config_paths.aliases }}"
    owner: "{{ ansible_user_id }}"
    group: "{{ ansible_user_gid }}"
    state: link
    follow: false
  tags:
    - dot

- name: Pyrightconfig - Config file
  ansible.builtin.file:
    src: "{{ host_files_dir }}/pyrightconfig.json"
    dest: "{{ config_paths.pyright_config }}"
    owner: "{{ ansible_user_id }}"
    group: "{{ ansible_user_gid }}"
    state: link
    follow: false
  tags:
    - dot

- name: .env_vars - Config file
  no_log: true
  ansible.builtin.template:
    src: "env_vars.j2"
    dest: "{{ config_paths.env_vars }}"
    owner: "{{ ansible_user_id }}"
    group: "{{ ansible_user_gid }}"
    mode: '0600'
  tags:
    - dot

- name: .zshrc - Config file
  ansible.builtin.template:
    src: "zshrc.j2"
    dest: "{{ config_paths.zshrc }}"
    owner: "{{ ansible_user_id }}"
    group: "{{ ansible_user_gid }}"
    mode: '0644'
  notify: Invalidate antigen cache
  tags:
    - dot

- name: Ghostty - Config directory
  ansible.builtin.file:
    path: "{{ user_dir }}/.config/ghostty"
    state: directory
    owner: "{{ ansible_user_id }}"
    group: "{{ ansible_user_gid }}"
    mode: '0700'
  tags:
    - dot

# Linked, not copied: a copy means edits made in the live file diverge silently
# and are then clobbered by the next apply. A link makes local tweaks show up as
# a git diff in this repo.
- name: Ghostty - Config file
  ansible.builtin.file:
    src: "{{ host_files_dir }}/ghostty.config"
    dest: "{{ config_paths.ghostty_config }}"
    state: link
    follow: false
    force: true
    owner: "{{ ansible_user_id }}"
    group: "{{ ansible_user_gid }}"
  tags:
    - dot

- name: .functions - Config file
  ansible.builtin.file:
    src: "{{ host_files_dir }}/functions"
    dest: "{{ config_paths.functions }}"
    owner: "{{ ansible_user_id }}"
    group: "{{ ansible_user_gid }}"
    state: link
    follow: false
  tags:
    - dot

# The 1Password SSH agent only offers keys from the vaults this file names.
- name: 1Password SSH agent - Config directory
  ansible.builtin.file:
    path: "{{ config_paths.ssh_agent_config | dirname }}"
    state: directory
    owner: "{{ ansible_user_id }}"
    group: "{{ ansible_user_gid }}"
    mode: '0700'
  tags:
    - dot

- name: 1Password SSH agent - Config file
  ansible.builtin.template:
    src: "1password-ssh-agent.toml.j2"
    dest: "{{ config_paths.ssh_agent_config }}"
    owner: "{{ ansible_user_id }}"
    group: "{{ ansible_user_gid }}"
    mode: '0600'
  tags:
    - dot

- name: .env_secrets - Secret environment variables
  no_log: true
  ansible.builtin.template:
    src: "env_secrets.j2"
    dest: "{{ config_paths.env_secrets }}"
    owner: "{{ ansible_user_id }}"
    group: "{{ ansible_user_gid }}"
    mode: '0600'
  tags:
    - dot

# Linked rather than templated: `git config --global` writes straight into this
# file, so linking means any change you make by hand turns up as a git diff here
# instead of drifting. force: true heals the link if git replaces it outright.
- name: Git - Global config file
  ansible.builtin.file:
    src: "{{ host_files_dir }}/gitconfig"
    dest: "{{ config_paths.gitconfig }}"
    state: link
    follow: false
    force: true
    owner: "{{ ansible_user_id }}"
    group: "{{ ansible_user_gid }}"
  tags:
    - dot
    - git

- name: Git - Config directory
  ansible.builtin.file:
    path: "{{ config_paths.git_ignore | dirname }}"
    state: directory
    owner: "{{ ansible_user_id }}"
    group: "{{ ansible_user_gid }}"
    mode: '0755'
  tags:
    - dot
    - git

- name: Git - Global ignore file
  ansible.builtin.file:
    src: "{{ host_files_dir }}/git_ignore"
    dest: "{{ config_paths.git_ignore }}"
    state: link
    follow: false
    force: true
    owner: "{{ ansible_user_id }}"
    group: "{{ ansible_user_gid }}"
  tags:
    - dot
    - git

- name: Skhd - Config file
  ansible.builtin.file:
    src: "{{ host_files_dir }}/skhdrc"
    dest: "{{ config_paths.skhdrc }}"
    state: link
    follow: false
    force: true
    owner: "{{ ansible_user_id }}"
    group: "{{ ansible_user_gid }}"
  notify: Restart skhd service
  tags:
    - dot
    - skhd

# Whether the launchd agent is actually loaded — not whether its plist file
# exists. `skhd --stop-service` (which the cleanup role runs) boots the job out
# and leaves the plist behind, so a `creates:` guard on that file reports "already
# done" forever and `make apply` can never bring skhd back. That is exactly what
# happened on 2026-09-11: a real cleanup run stopped the service, every later
# apply skipped the start task, and the bare F-key bindings stayed dead until
# skhd was started by hand.
#
# check_mode: false so the probe still runs under `make check` and the `when`
# below is evaluated against the real machine rather than being skipped.
#
# This detects a job that is gone, which is the failure that actually happens.
# It does not detect a job that is still registered with launchd but no longer
# running; reviving that needs `--restart-service`, and `--start-service` on an
# already-bootstrapped job is a no-op (verified: rc 0, running pid untouched).
- name: Skhd - Check whether the launchd agent is loaded
  ansible.builtin.command:
    cmd: "launchctl print gui/{{ ansible_user_uid }}/com.koekeishiya.skhd"
  register: dotfiles_skhd_service
  changed_when: false
  failed_when: false
  check_mode: false
  tags:
    - dot
    - skhd

# `skhd --start-service` writes the launchd agent if it is missing and bootstraps
# it either way, so it is safe to call whenever the job is not loaded.
#
# skhd will keep crashing on launch until it has been granted Accessibility
# access, which macOS will not grant non-interactively:
#   System Settings > Privacy & Security > Accessibility > add
#   /opt/homebrew/bin/skhd, toggle it on.
# Bare F-key presses only reach skhd, rather than the OS's default media-key
# handling, once that permission is granted AND fnState (see the macos role)
# is applied.
- name: Skhd - Install and start service
  ansible.builtin.command:
    cmd: "{{ homebrew_prefix }}/bin/skhd --start-service"
  when: dotfiles_skhd_service.rc != 0
  changed_when: true
  tags:
    - dot
    - skhd

- name: Forge - Config directory
  ansible.builtin.file:
    path: "{{ config_paths.forge_dir }}"
    state: directory
    owner: "{{ ansible_user_id }}"
    group: "{{ ansible_user_gid }}"
    mode: '0700'
  tags:
    - dot
    - forge

# Forge skills moved to the ai_agents role, which shares one skill set across
# every harness instead of keeping a forge-only copy.

- name: Forge - MCP config
  ansible.builtin.template:
    src: "forge.mcp.json.j2"
    dest: "{{ config_paths.forge_mcp }}"
    owner: "{{ ansible_user_id }}"
    group: "{{ ansible_user_gid }}"
    mode: '0600'
  no_log: true
  tags:
    - dot
    - forge
