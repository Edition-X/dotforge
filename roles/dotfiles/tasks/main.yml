---
- name: .aliases - Config file
  ansible.builtin.file:
    src: "{{ host_files_dir }}/aliases"
    dest: "{{ config_paths.aliases }}"
    owner: "{{ ansible_user_uid | quote }}"
    group: "{{ ansible_user_gid | quote }}"
    state: link
  tags:
    - dot

- name: Pyrightconfig - Config file
  ansible.builtin.file:
    src: "{{ host_files_dir }}/pyrightconfig.json"
    dest: "{{ config_paths.pyright_config }}"
    owner: "{{ ansible_user_uid | quote }}"
    group: "{{ ansible_user_gid | quote }}"
    state: link
  tags:
    - dot

- name: .env_vars - Config file
  no_log: true
  ansible.builtin.template:
    src: "env_vars.j2"
    dest: "{{ config_paths.env_vars }}"
    owner: "{{ ansible_user_uid | quote }}"
    group: "{{ ansible_user_gid | quote }}"
    mode: '0600'
  tags:
    - dot

- name: .zshrc - Config file
  ansible.builtin.template:
    src: "zshrc.j2"
    dest: "{{ config_paths.zshrc }}"
    owner: "{{ ansible_user_uid | quote }}"
    group: "{{ ansible_user_gid | quote }}"
    mode: '0644'
  notify: Invalidate antigen cache
  tags:
    - dot

- name: Ghostty - Config directory
  ansible.builtin.file:
    path: "{{ user_dir }}/.config/ghostty"
    state: directory
    owner: "{{ ansible_user_uid | quote }}"
    group: "{{ ansible_user_gid | quote }}"
    mode: '0700'
  tags:
    - dot

# Linked, not copied: a copy means edits made in the live file diverge silently
# and are then clobbered by the next apply. A link makes local tweaks show up as
# a git diff in this repo.
- name: Ghostty - Config file
  ansible.builtin.file:
    src: "{{ host_files_dir }}/ghostty.config"
    dest: "{{ config_paths.ghostty_config }}"
    state: link
    force: true
    owner: "{{ ansible_user_uid | quote }}"
    group: "{{ ansible_user_gid | quote }}"
  tags:
    - dot

- name: .functions - Config file
  ansible.builtin.file:
    src: "{{ host_files_dir }}/functions"
    dest: "{{ config_paths.functions }}"
    owner: "{{ ansible_user_uid | quote }}"
    group: "{{ ansible_user_gid | quote }}"
    state: link
  tags:
    - dot

- name: .env_secrets - Secret environment variables
  no_log: true
  ansible.builtin.template:
    src: "env_secrets.j2"
    dest: "{{ config_paths.env_secrets }}"
    owner: "{{ ansible_user_uid | quote }}"
    group: "{{ ansible_user_gid | quote }}"
    mode: '0600'
  tags:
    - dot

# Linked rather than templated: `git config --global` writes straight into this
# file, so linking means any change you make by hand turns up as a git diff here
# instead of drifting. force: true heals the link if git replaces it outright.
- name: Git - Global config file
  ansible.builtin.file:
    src: "{{ host_files_dir }}/gitconfig"
    dest: "{{ config_paths.gitconfig }}"
    state: link
    force: true
    owner: "{{ ansible_user_uid | quote }}"
    group: "{{ ansible_user_gid | quote }}"
  tags:
    - dot
    - git

- name: Git - Config directory
  ansible.builtin.file:
    path: "{{ config_paths.git_ignore | dirname }}"
    state: directory
    owner: "{{ ansible_user_uid | quote }}"
    group: "{{ ansible_user_gid | quote }}"
    mode: '0755'
  tags:
    - dot
    - git

- name: Git - Global ignore file
  ansible.builtin.file:
    src: "{{ host_files_dir }}/git_ignore"
    dest: "{{ config_paths.git_ignore }}"
    state: link
    force: true
    owner: "{{ ansible_user_uid | quote }}"
    group: "{{ ansible_user_gid | quote }}"
  tags:
    - dot
    - git

- name: Skhd - Config file
  ansible.builtin.file:
    src: "{{ host_files_dir }}/skhdrc"
    dest: "{{ config_paths.skhdrc }}"
    state: link
    force: true
    owner: "{{ ansible_user_uid | quote }}"
    group: "{{ ansible_user_gid | quote }}"
  notify: Restart skhd service
  tags:
    - dot
    - skhd

# `skhd --start-service` installs and loads a launchd agent, idempotent via
# `creates` — the plist not existing is the only signal used, so this never
# re-runs once skhd has been started here at least once.
#
# skhd will keep crashing on launch until it has been granted Accessibility
# access, which macOS will not grant non-interactively:
#   System Settings > Privacy & Security > Accessibility > add
#   /opt/homebrew/bin/skhd, toggle it on.
# Bare F-key presses only reach skhd, rather than the OS's default media-key
# handling, once that permission is granted AND fnState (see the macos role)
# is applied.
- name: Skhd - Install and start service
  ansible.builtin.command:
    cmd: "{{ homebrew_prefix }}/bin/skhd --start-service"
    creates: "{{ user_dir }}/Library/LaunchAgents/com.koekeishiya.skhd.plist"
  tags:
    - dot
    - skhd

- name: Forge - Config directory
  ansible.builtin.file:
    path: "{{ config_paths.forge_dir }}"
    state: directory
    owner: "{{ ansible_user_uid | quote }}"
    group: "{{ ansible_user_gid | quote }}"
    mode: '0700'
  tags:
    - dot
    - forge

# Forge skills moved to the ai_agents role, which shares one skill set across
# every harness instead of keeping a forge-only copy.

- name: Forge - MCP config
  ansible.builtin.template:
    src: "forge.mcp.json.j2"
    dest: "{{ config_paths.forge_mcp }}"
    owner: "{{ ansible_user_uid | quote }}"
    group: "{{ ansible_user_gid | quote }}"
    mode: '0600'
  tags:
    - dot
    - forge
