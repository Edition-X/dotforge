<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}}</title>
<style>
/* ============================================================
   plan-to-html — light editorial design system
   All styling lives here. Edit the variables below to retheme.
   ============================================================ */
:root{
  --serif:'Iowan Old Style','Palatino Linotype',Palatino,'Book Antiqua','Hoefler Text',Georgia,'Times New Roman',serif;
  --sans:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,Roboto,Helvetica,Arial,'Apple Color Emoji','Segoe UI Emoji',sans-serif;
  --mono:'SF Mono',ui-monospace,'JetBrains Mono',Menlo,Monaco,Consolas,'Liberation Mono',monospace;

  --bg:#f8f7f4;
  --bg-2:#f1efea;
  --surface:#ffffff;
  --surface-2:#fbfaf8;
  --border:#e7e4dc;
  --border-strong:#d9d4c9;
  --text:#1d1c1a;
  --text-2:#4b4945;
  --muted:#83807a;
  --accent:#3b4a9c;
  --accent-2:#5a68bd;
  --accent-soft:#edeef9;
  --green:#2f7d52; --green-soft:#e7f2ec;
  --amber:#9c6307; --amber-soft:#f6edda;
  --red:#ad4130;  --red-soft:#f6e6e1;
  --shadow:0 1px 2px rgba(28,27,25,.04),0 6px 22px rgba(28,27,25,.06);
  --shadow-sm:0 1px 2px rgba(28,27,25,.05);
  --ring:rgba(59,74,156,.32);
  --radius:14px; --radius-sm:9px;
}
html[data-theme="dark"]{
  --bg:#15161a;
  --bg-2:#1a1c21;
  --surface:#1c1e25;
  --surface-2:#212430;
  --border:#2b2e38;
  --border-strong:#3b3f4b;
  --text:#e9e8e3;
  --text-2:#c2c0b8;
  --muted:#8d8a82;
  --accent:#9aa6f0;
  --accent-2:#b3bcf5;
  --accent-soft:#23273b;
  --green:#74d39c; --green-soft:#19271f;
  --amber:#e0a850; --amber-soft:#2a2316;
  --red:#ec8a78;  --red-soft:#2c1c19;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.35);
  --shadow-sm:0 1px 2px rgba(0,0,0,.3);
  --ring:rgba(154,166,240,.4);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{
  margin:0;background:var(--bg);color:var(--text);
  font-family:var(--sans);font-size:17px;line-height:1.7;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
}
::selection{background:var(--accent-soft);color:var(--text)}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline;text-underline-offset:2px}

/* ---------- top bar ---------- */
.topbar{
  position:sticky;top:0;z-index:40;
  display:flex;align-items:center;gap:14px;
  padding:10px clamp(16px,4vw,40px);
  background:color-mix(in srgb,var(--bg) 86%,transparent);
  backdrop-filter:saturate(140%) blur(10px);
  border-bottom:1px solid var(--border);
}
.topbar .doc-kicker{font-size:.72rem;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);font-weight:600}
.topbar .doc-kicker b{color:var(--accent);font-weight:600}
.topbar .spacer{flex:1}
.iconbtn{
  display:inline-flex;align-items:center;justify-content:center;gap:7px;
  height:34px;padding:0 12px;border:1px solid var(--border-strong);border-radius:999px;
  background:var(--surface);color:var(--text-2);font:inherit;font-size:.82rem;cursor:pointer;
  transition:border-color .15s,color .15s,background .15s;
}
.iconbtn:hover{color:var(--text);border-color:var(--accent)}
.iconbtn svg{width:15px;height:15px}
.iconbtn .lbl{font-weight:500}

/* ---------- shell / layout ---------- */
.shell{
  max-width:1140px;margin:0 auto;padding:0 clamp(16px,4vw,40px) 96px;
  display:grid;grid-template-columns:1fr;gap:34px;
}
@media(min-width:940px){
  .shell{grid-template-columns:248px minmax(0,1fr);gap:54px;align-items:start}
}

/* ---------- table of contents ---------- */
.toc{
  font-size:.9rem;
}
@media(min-width:940px){
  .toc{position:sticky;top:64px;max-height:calc(100vh - 88px);overflow:auto;padding-right:6px}
}
.toc .toc-title{
  font-size:.72rem;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);
  font-weight:600;margin:28px 0 12px;
}
.toc ol{list-style:none;margin:0;padding:0;counter-reset:toc}
.toc li{margin:0}
.toc a{
  counter-increment:toc;
  display:flex;gap:10px;padding:5px 10px;border-radius:8px;
  color:var(--text-2);border-left:2px solid transparent;
  transition:color .15s,background .15s,border-color .15s;
}
.toc a::before{content:counter(toc);color:var(--muted);font-variant-numeric:tabular-nums;min-width:1.1em;font-size:.85em;padding-top:.05em}
.toc a:hover{color:var(--text);background:var(--surface-2);text-decoration:none}
.toc a.active{color:var(--accent);font-weight:600;background:var(--accent-soft);border-left-color:var(--accent)}
.toc a.active::before{color:var(--accent)}

/* ---------- document header ---------- */
.doc{min-width:0}
.doc-head{padding:40px 0 30px;border-bottom:1px solid var(--border);margin-bottom:8px}
.kicker{font-size:.76rem;letter-spacing:.17em;text-transform:uppercase;color:var(--accent);font-weight:600;margin:0 0 14px}
h1{
  font-family:var(--serif);font-weight:600;letter-spacing:-.015em;
  font-size:clamp(2.05rem,1.4rem + 2.5vw,2.85rem);line-height:1.12;margin:0;color:var(--text);
}
.summary{font-size:1.16rem;line-height:1.55;color:var(--text-2);margin:18px 0 0;max-width:46ch}
.meta{display:flex;flex-wrap:wrap;gap:10px 20px;margin-top:24px;font-size:.86rem;color:var(--muted)}
.meta .m{display:flex;align-items:center;gap:7px}
.meta .m .mk{text-transform:uppercase;letter-spacing:.08em;font-size:.7rem;font-weight:600}
.meta .m .mv{color:var(--text-2);font-weight:500}

/* ---------- sections + auto numbering ---------- */
.doc{counter-reset:sec}
section.sec{padding:34px 0;border-bottom:1px solid var(--border);scroll-margin-top:72px}
section.sec:last-of-type{border-bottom:0}
section.sec>h2{
  counter-increment:sec;font-family:var(--serif);font-weight:600;letter-spacing:-.01em;
  font-size:1.62rem;line-height:1.2;margin:0 0 18px;display:flex;gap:.6em;align-items:baseline;
}
section.sec>h2::before{content:counter(sec);color:var(--accent);font-size:.78em;font-variant-numeric:tabular-nums;font-weight:600}
h3{font-size:1.06rem;font-weight:650;letter-spacing:-.005em;margin:30px 0 10px;color:var(--text)}
h4{font-size:.96rem;font-weight:650;margin:22px 0 8px;color:var(--text)}
p{margin:0 0 16px}
.doc p,.doc li{max-width:74ch}
ul,ol{margin:0 0 16px;padding-left:1.4em}
li{margin:6px 0}
hr{border:0;border-top:1px solid var(--border);margin:30px 0}
strong{font-weight:650}
small,.small{font-size:.85rem;color:var(--muted)}

/* ---------- at a glance ---------- */
.glance{
  display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin:6px 0 4px;
}
.stat{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
  padding:16px 18px;box-shadow:var(--shadow-sm);
}
.stat .k{font-size:.7rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600;margin-bottom:6px}
.stat .v{font-size:1.12rem;font-weight:600;line-height:1.3;color:var(--text)}
.stat .v.serif{font-family:var(--serif);font-size:1.32rem}

/* ---------- phase cards ---------- */
.phase{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
  padding:22px 24px;margin:16px 0;box-shadow:var(--shadow-sm);
}
.phase-head{display:flex;align-items:flex-start;gap:14px;margin-bottom:6px}
.phase-num{
  flex:none;width:30px;height:30px;border-radius:9px;background:var(--accent-soft);color:var(--accent);
  display:flex;align-items:center;justify-content:center;font-weight:650;font-size:.95rem;
  font-variant-numeric:tabular-nums;margin-top:2px;
}
.phase-title{font-family:var(--serif);font-size:1.22rem;font-weight:600;margin:0;line-height:1.25;flex:1}
.phase-meta{font-size:.8rem;color:var(--muted);margin-top:3px}
.phase .steps{counter-reset:step;list-style:none;padding-left:0;margin:14px 0 0}
.phase .steps>li{position:relative;padding-left:30px;margin:10px 0}
.phase .steps>li::before{
  counter-increment:step;content:counter(step);position:absolute;left:0;top:.05em;
  width:20px;height:20px;border-radius:6px;background:var(--bg-2);color:var(--text-2);
  font-size:.72rem;font-weight:600;display:flex;align-items:center;justify-content:center;
}

/* ---------- callouts ---------- */
.callout{
  display:flex;gap:13px;padding:15px 18px;margin:18px 0;border-radius:var(--radius-sm);
  background:var(--surface-2);border:1px solid var(--border);border-left:3px solid var(--muted);
}
.callout .ic{flex:none;width:19px;height:19px;margin-top:3px;color:var(--muted)}
.callout .ic svg{width:19px;height:19px;display:block}
.callout .body{min-width:0}
.callout .body>:first-child{margin-top:0}
.callout .body>:last-child{margin-bottom:0}
.callout .body b,.callout .body strong{display:block;margin-bottom:2px}
.callout--note{background:var(--accent-soft);border-color:var(--border);border-left-color:var(--accent)}
.callout--note .ic{color:var(--accent)}
.callout--ok{background:var(--green-soft);border-left-color:var(--green)}
.callout--ok .ic{color:var(--green)}
.callout--warn{background:var(--amber-soft);border-left-color:var(--amber)}
.callout--warn .ic{color:var(--amber)}
.callout--risk{background:var(--red-soft);border-left-color:var(--red)}
.callout--risk .ic{color:var(--red)}
.callout--decision{background:var(--surface-2);border-left-color:var(--accent)}
.callout--decision .ic{color:var(--accent)}

/* ---------- file change lists ---------- */
.files{list-style:none;padding:0;margin:16px 0}
.files li{
  display:flex;align-items:baseline;gap:12px;padding:9px 0;margin:0;border-bottom:1px solid var(--border);max-width:none;
}
.files li:last-child{border-bottom:0}
.op{
  flex:none;font-family:var(--mono);font-size:.66rem;font-weight:700;letter-spacing:.06em;
  text-transform:uppercase;padding:2px 7px;border-radius:5px;min-width:50px;text-align:center;
}
.op--new{background:var(--green-soft);color:var(--green)}
.op--edit{background:var(--amber-soft);color:var(--amber)}
.op--del{background:var(--red-soft);color:var(--red)}
.op--move{background:var(--accent-soft);color:var(--accent)}
.files code{font-family:var(--mono);font-size:.88rem;color:var(--text);background:none;padding:0}
.files .desc{color:var(--muted);font-size:.9rem}

/* ---------- tables ---------- */
.table-wrap{overflow-x:auto;margin:18px 0;border:1px solid var(--border);border-radius:var(--radius-sm)}
table.tbl{border-collapse:collapse;width:100%;font-size:.92rem;min-width:440px}
table.tbl th,table.tbl td{text-align:left;padding:11px 16px;border-bottom:1px solid var(--border);vertical-align:top}
table.tbl thead th{
  background:var(--surface-2);font-size:.72rem;letter-spacing:.07em;text-transform:uppercase;
  color:var(--muted);font-weight:600;
}
table.tbl tbody tr:last-child td{border-bottom:0}
table.tbl tbody tr:hover{background:var(--surface-2)}

/* ---------- checklist ---------- */
.checklist{list-style:none;padding:0;margin:16px 0}
.checklist li{display:flex;gap:11px;align-items:flex-start;padding:7px 0;margin:0}
.checklist li::before{
  content:"";flex:none;width:18px;height:18px;border-radius:5px;border:1.5px solid var(--border-strong);
  margin-top:4px;background:var(--surface);
}
.checklist li.done::before{
  background:var(--green);border-color:var(--green);
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><path fill='white' d='M6.2 11.3 3 8.1l1.1-1.1 2.1 2.1 5-5L12.3 5z'/></svg>");
  background-repeat:no-repeat;background-position:center;
}
.checklist li.done{color:var(--muted)}

/* ---------- pills ---------- */
.pill{
  display:inline-flex;align-items:center;gap:5px;font-size:.74rem;font-weight:600;line-height:1;
  padding:4px 9px;border-radius:999px;background:var(--bg-2);color:var(--text-2);
  letter-spacing:.02em;vertical-align:middle;
}
.pill--ok{background:var(--green-soft);color:var(--green)}
.pill--info{background:var(--accent-soft);color:var(--accent)}
.pill--warn{background:var(--amber-soft);color:var(--amber)}
.pill--danger{background:var(--red-soft);color:var(--red)}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.85}

/* ---------- progressive disclosure ---------- */
details.more{
  border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--surface-2);
  margin:16px 0;overflow:hidden;
}
details.more>summary{
  cursor:pointer;padding:12px 16px;font-weight:600;font-size:.92rem;color:var(--text-2);
  list-style:none;display:flex;align-items:center;gap:9px;
}
details.more>summary::-webkit-details-marker{display:none}
details.more>summary::before{
  content:"";width:7px;height:7px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);
  transform:rotate(-45deg);transition:transform .2s;margin-left:2px;
}
details.more[open]>summary::before{transform:rotate(45deg)}
details.more>summary:hover{color:var(--text)}
details.more .more-body{padding:0 16px 14px}
details.more .more-body>:first-child{margin-top:0}

/* ---------- code ---------- */
code{font-family:var(--mono);font-size:.88em;background:var(--bg-2);padding:.12em .4em;border-radius:5px;color:var(--text)}
pre{
  background:var(--surface-2);border:1px solid var(--border);border-radius:var(--radius-sm);
  padding:16px 18px;overflow-x:auto;margin:18px 0;font-size:.85rem;line-height:1.6;
}
pre code{background:none;padding:0;font-size:inherit}

/* ---------- blockquote ---------- */
blockquote{
  margin:18px 0;padding:6px 0 6px 20px;border-left:3px solid var(--border-strong);
  color:var(--text-2);font-family:var(--serif);font-style:italic;font-size:1.08rem;
}

/* ---------- footer ---------- */
.doc-foot{margin-top:30px;padding-top:22px;border-top:1px solid var(--border);font-size:.82rem;color:var(--muted)}
.doc-foot a{color:var(--muted);text-decoration:underline;text-underline-offset:2px}

/* ---------- print ---------- */
@media print{
  .topbar,.toc{display:none}
  body{background:#fff;font-size:11pt}
  .shell{display:block;max-width:none;padding:0}
  .phase,.stat,.callout,details.more{box-shadow:none;break-inside:avoid}
  section.sec{break-inside:avoid-page}
  a{color:inherit}
}
</style>
</head>
<body>
<header class="topbar">
  <span class="doc-kicker"><b>{{KICKER}}</b></span>
  <span class="spacer"></span>
  <button class="iconbtn" id="printBtn" title="Print or save as PDF">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg>
    <span class="lbl">Print</span>
  </button>
  <button class="iconbtn" id="themeBtn" title="Toggle light / dark">
    <svg id="themeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    <span class="lbl">Theme</span>
  </button>
</header>

<div class="shell">
  <aside class="toc" aria-label="Table of contents">
    <div class="toc-title">On this page</div>
    <ol id="toc-list">
{{TOC}}
    </ol>
  </aside>

  <main class="doc">
    <div class="doc-head">
      <p class="kicker">{{KICKER}}</p>
      <h1>{{TITLE}}</h1>
      {{SUMMARY}}
      <div class="meta">
{{META_ROW}}
      </div>
    </div>

{{BODY}}

    <footer class="doc-foot">
      {{FOOTER}}
    </footer>
  </main>
</div>

<script>
(function(){
  // theme toggle (persisted where storage is allowed; tolerates file://)
  var root=document.documentElement;
  try{var saved=localStorage.getItem('plan-theme');if(saved)root.setAttribute('data-theme',saved);}catch(e){}
  var tbtn=document.getElementById('themeBtn');
  if(tbtn)tbtn.addEventListener('click',function(){
    var next=root.getAttribute('data-theme')==='dark'?'light':'dark';
    root.setAttribute('data-theme',next);
    try{localStorage.setItem('plan-theme',next);}catch(e){}
  });
  var pbtn=document.getElementById('printBtn');
  if(pbtn)pbtn.addEventListener('click',function(){window.print();});

  // scroll-spy: highlight the TOC entry for the section in view
  var links=Array.prototype.slice.call(document.querySelectorAll('#toc-list a'));
  var map={};links.forEach(function(a){var id=a.getAttribute('href').slice(1);map[id]=a;});
  var secs=links.map(function(a){return document.getElementById(a.getAttribute('href').slice(1));}).filter(Boolean);
  if('IntersectionObserver' in window && secs.length){
    var visible=new Set();
    var obs=new IntersectionObserver(function(entries){
      entries.forEach(function(en){if(en.isIntersecting)visible.add(en.target);else visible.delete(en.target);});
      var top=null;
      secs.forEach(function(s){if(visible.has(s)&&top===null)top=s;});
      if(top===null){ // none fully visible: pick last one above the fold
        for(var i=secs.length-1;i>=0;i--){if(secs[i].getBoundingClientRect().top<120){top=secs[i];break;}}
      }
      links.forEach(function(a){a.classList.remove('active');});
      if(top&&map[top.id])map[top.id].classList.add('active');
    },{rootMargin:'-64px 0px -65% 0px',threshold:0});
    secs.forEach(function(s){obs.observe(s);});
  }

  // expand all <details> before printing so nothing is hidden in the PDF
  window.addEventListener('beforeprint',function(){
    document.querySelectorAll('details').forEach(function(d){d.dataset._o=d.open?'1':'';d.open=true;});
  });
  window.addEventListener('afterprint',function(){
    document.querySelectorAll('details').forEach(function(d){if(d.dataset._o!=='1')d.open=false;});
  });
})();
</script>
</body>
</html>
