---
name: Browser catalog

# Validation only. This workflow never captures bookmarks, never reads a browser
# profile, and never touches local state: everything it needs is in the repo.
"on":
  pull_request:
    branches: [ main ]
    paths:
      - 'host_files/localhost/browsers/**'
      - 'scripts/browser-*.py'
      - 'scripts/validate-browser-catalog.py'
      - 'roles/browsers/**'
      - '.github/workflows/browser-catalog.yml'

permissions:
  contents: read

jobs:
  catalogs:
    name: Validate browser catalogs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Validate catalog schemas
        run: python scripts/validate-browser-catalog.py --all

      - name: Check reconciliation fixtures
        run: |
          python scripts/browser-capture.py --fixtures tests/fixtures/browsers --check-only
          python scripts/browser-reconcile.py --fixtures tests/fixtures/browsers --additions-only --check-only

      - name: Check the isolated publishing contract
        run: python scripts/browser-git-automation.py --check --isolated-root "$HOME/.local/state"

      - name: Check changed paths against the catalog allowlist
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          git diff --name-only "$BASE_SHA" "$HEAD_SHA" > changed-paths.txt
          python - <<'PY'
          import sys
          from pathlib import Path

          allowed_prefixes = (
              "host_files/localhost/browsers/",
              "scripts/browser-",
              "scripts/validate-browser-catalog.py",
              "roles/browsers/",
              ".github/workflows/browser-catalog.yml",
              "docs/",
              "README.md",
              "Makefile",
          )
          changed = [line for line in Path("changed-paths.txt").read_text().splitlines() if line]
          catalogs = [path for path in changed if path.startswith("host_files/localhost/browsers/")]
          bad = [path for path in catalogs if not path.endswith((".yml", ".yaml"))]
          if bad:
              print(f"browser catalog paths: failed non-catalog-files={len(bad)}")
              sys.exit(1)
          outside = [path for path in changed if not path.startswith(allowed_prefixes)]
          if catalogs and outside:
              print(f"browser catalog paths: failed catalog-change-mixed-with-other-files={len(outside)}")
              sys.exit(1)
          print(f"browser catalog paths: pass changed={len(changed)} catalogs={len(catalogs)}")
          PY

      - name: Check output stays free of URLs and secrets
        run: |
          python scripts/validate-browser-catalog.py --all > catalog-output.txt
          python scripts/browser-git-automation.py --check \
            --isolated-root "$HOME/.local/state" >> catalog-output.txt
          if grep -Eq '://|bearer |gh[pousr]_[A-Za-z0-9]{20,}' catalog-output.txt; then
            echo "browser catalog output: failed url-or-secret-in-output"
            exit 1
          fi
          echo "browser catalog output: pass counts-only=true"

      - name: Scan the diff for forbidden browser material
        run: |
          if git ls-files | grep -Eiq 'Login Data|key4\.db|logins\.json|Cookies|Secure Preferences'; then
            echo "browser catalog secrets: failed forbidden-browser-state-tracked"
            exit 1
          fi
          echo "browser catalog secrets: pass forbidden-state=absent"

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
