---
- name: MacBook Pro Configuration
  hosts: macbooks
  gather_facts: true

  # packages runs early: dotfiles now installs a launchd service (skhd) for a
  # binary this role installs, so the binary has to exist first. `make dotfiles`
  # alone still works against an already-provisioned machine; it is only a
  # from-scratch `make apply` that needed the reorder.
  roles:
    - { role: common, tags: ['common'] }
    - { role: packages, tags: ['packages'] }
    - { role: ssh, tags: ['ssh', 'dot'] }
    - { role: dotfiles, tags: ['dotfiles', 'dot'] }
    - { role: mcp_toolkit, tags: ['mcp', 'dot'] }
    - { role: ai_agents, tags: ['ai', 'dot'] }
    - { role: neovim, tags: ['neovim', 'dot'] }
    - { role: tmux, tags: ['tmux', 'dot'] }
    - { role: macos, tags: ['macos'] }
    - { role: cleanup, tags: ['cleanup'], when: "cleanup | default(false) | bool" }
