---
# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
repos:
  # Version-controlled replacement for what used to be an untracked script in
  # .git/hooks/pre-commit.legacy.
  - repo: local
    hooks:
      - id: check-unencrypted-secrets
        name: check for unencrypted secrets
        entry: scripts/check-unencrypted-secrets.sh
        language: script
        pass_filenames: false
        always_run: true

      # Advisory only — reports drift and exits 0. See the script header.
      - id: check-agent-config-drift
        name: check deployed agent config still links to this repo
        entry: scripts/check-agent-config-drift.sh
        language: script
        pass_filenames: false
        files: ^host_files/localhost/ai/

      - id: check-skills
        name: check skill files
        entry: scripts/check-skills.sh
        language: script
        pass_filenames: false
        files: ^host_files/localhost/ai/skills/

      - id: check-opencode-source
        name: check OpenCode source policy
        entry: scripts/check-opencode-source.sh
        language: script
        pass_filenames: false
        files: >-
          ^(
            AGENTS\.md|
            group_vars/macbooks\.yml|
            host_vars/localhost/opencode\.yml|
            host_files/localhost/ai/(AGENTS\.md|README\.md|opencode/.*)|
            roles/ai_agents/(defaults/main\.yml|tasks/main\.yml|templates/.*)|
            scripts/validate-opencode-config\.sh
          )$

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        exclude: >
          (?x)^(
            collections/.*
          )$
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: mixed-line-ending
        args: ['--fix=lf']

  - repo: https://github.com/ansible-community/ansible-lint
    rev: v26.6.0
    hooks:
      - id: ansible-lint
        files: \.(yaml|yml)$
        # The ansible-lint hook will use our custom .ansible-lint configuration
        args: ['--force-color']
        additional_dependencies:
          - ansible-core>=2.15.0
        # Note: Vault handling is configured via environment variables at runtime
        # See ansible documentation for ANSIBLE_VAULT_PASSWORD_FILE and related variables

  - repo: https://github.com/adrienverge/yamllint
    rev: v1.37.1
    hooks:
      - id: yamllint
        args: ['-d', '{extends: relaxed, rules: {line-length: {max: 120}}}']
        # Exclude third-party files that we don't need to lint
        exclude: >
          (?x)^(
            host_files/localhost/nvim/autoload/plugged/.*|
            host_files/localhost/nvim/pack/github/start/copilot.vim/.*|
            collections/.*
          )$
